name: Check editor releases manually
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Report versions without rebuilding or uploading artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/update_bundled_apps.py --check
          cat .tools/bundled-update/report.json >> "$GITHUB_STEP_SUMMARY"
