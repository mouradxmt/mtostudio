name: Mtouaa manual checks
# Cloud builds are intentionally disabled. Local releases use tools/release_local.py.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Small regression checks only
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          node tools/test_save_bridge.mjs
# No source compilers, signing keys, caches, or artifact uploads.
